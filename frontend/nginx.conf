server {
  listen 80;
  root /usr/share/nginx/html;

  # File có hash trong tên -> cache lâu
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: mọi route (/topics/...) trả về index.html
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
